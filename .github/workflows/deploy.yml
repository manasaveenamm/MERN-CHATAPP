name: CI/CD Pipeline - MERN Chat App

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # --- CONTINUOUS INTEGRATION (CI) ---
  build-and-test:
    name: Continuous Integration (CI)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install & Validate Backend
        run: |
          cd backend
          npm ci
          # npm test  # Uncomment if unit tests are written

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

  # --- CONTINUOUS DEPLOYMENT (CD) ---
  deploy-to-ec2:
    name: Continuous Deployment (CD)
    needs: build-and-test # Only deploy if CI step passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy to AWS EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/MERN_PROJECTS/Chatapp/fullstack-chat-app
            git pull origin main
            docker compose down
            docker compose up -d --build
            docker image prune -f
